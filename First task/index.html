
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 40px 35px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    margin: 0 auto 20px;
}

h2 {
    text-align: center;
    font-size: 27px;
    color: #222;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
}

.input-group input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
    background: #fafafa;
}

.input-group input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #667eea;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-bottom: 25px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #666;
}

.options a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
}

.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.35);
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 25px 0;
    color: #aaa;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #e5e5e5;
    flex: 1;
}

.google-btn {
    width: 100%;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    transition: 0.3s;
}

.google-btn:hover {
    background: #f7f7f7;
}

.signup {
    text-align: center;
    font-size: 13px;
    color: #777;
    margin-top: 25px;
}

.signup a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
}

.footer {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-top: 25px;
}

@media(max-width: 480px) {
    .login-container {
        padding: 35px 22px;
    }

    h2 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">L</div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Please login to your account</p>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password"
                placeholder="Enter your password" required>
                <button type="button" class="toggle-password"
                onclick="togglePassword()">Show</button>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
            Sign In
        </button>

    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button class="google-btn" type="button">
        🌐 Continue with Google
    </button>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>

    <div class="footer">
        © 2026 Your Website. All rights reserved.
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Login form submitted! Connect a backend to authenticate.");
});
</script>

</body>
</html>
